name: Tests and distributions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: brew install gmp
      - run: python -m pip install '.[test]' build
      - run: python setup.py build_ext --inplace
      - run: python -m pytest tests -q
      - run: python examples/01_quickstart_3_lines.py
      - name: Build wheel from source distribution
        run: python -m build
      - name: Check installed wheel outside the source import path
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I tests/smoke_installed.py --require-native --require-ml

  fallback:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - name: Build without a native compiler
        env:
          CC: /usr/bin/false
          CXX: /usr/bin/false
        run: python -m build
      - run: python -m pip install dist/*.whl pytest
      - run: python -m pytest tests/test_solver_regressions.py tests/test_ising.py tests/test_ising_linearized.py -q
      - run: python -I tests/smoke_installed.py --require-fallback
