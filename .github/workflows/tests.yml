name: Tests and distributions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: brew install gmp
      - run: python -m pip install '.[test]' build
      - run: python setup.py build_ext --inplace
      - run: python -m pytest tests -q
      - run: python examples/01_quickstart_3_lines.py
      - name: Build wheel from source distribution
        run: python -m build
      - name: Check installed wheel outside the source import path
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I tests/smoke_installed.py --require-native --require-ml
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-native-macos-python3.13
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  fallback:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            dependencies: minimum
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - name: Build without a native compiler
        env:
          CC: /usr/bin/false
          CXX: /usr/bin/false
        run: python -m build
      - name: Install with minimum supported dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install dist/*.whl pytest 'numpy==2.0.0' 'scipy==1.13.0' 'networkx==3.2' 'highspy==1.11.0' 'dwave-graphs==1.0.0'
      - name: Install with current dependencies
        if: matrix.dependencies != 'minimum'
        run: python -m pip install dist/*.whl pytest
      - run: python -m pytest tests/test_solver_regressions.py tests/test_ising.py tests/test_ising_linearized.py tests/test_ising_sparse.py -q
      - run: python -I tests/smoke_installed.py --require-fallback
      - name: Check minimum PyTorch extra with NumPy 2
        if: matrix.dependencies == 'minimum'
        run: |
          python -m pip install 'torch==2.4.1' --index-url https://download.pytorch.org/whl/cpu
          python -c "import numpy as np, torch; source = np.array([1., 2.]); np.testing.assert_array_equal(torch.from_numpy(source).numpy(), source)"
          python -m pytest tests/test_surrogate_model.py -q
          python -I tests/smoke_installed.py --require-fallback --require-ml
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-fallback-${{ matrix.os }}-python${{ matrix.python }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
